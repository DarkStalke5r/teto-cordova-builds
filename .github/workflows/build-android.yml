name: Build Cordova Android debug

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 22

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Add platform & build
        run: |
          cordova platform add android@13 --nofetch || true
          cordova prepare android
          cordova build android --debug -- --gradleArg=-Dorg.gradle.jvmargs=-Xmx2g

      - name: Locate APK
        id: apk
        run: |
          APK=$(find platforms/android -name "*.apk" | head -n1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 2
