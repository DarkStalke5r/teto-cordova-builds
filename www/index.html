      const fallbackToText = async (url) => {
        if (!url || url.startsWith("data:") || url.startsWith("about:")) return;
        setStatus("iframe заблокирован — загружаю текст страницы…");
        try {
          const data = await fetchPageText(url);
          showReader(url, data);
          setStatus("Показан текстовый снимок страницы (сайт запретил iframe)", true);
          notify("Сайт в iframe не открылся — показан текст", "info");
        } catch (e) {
          setStatus("Не удалось загрузить текст. Можно открыть снаружи.");
          showMode("reader");
          reader.innerHTML = `
            <p style="color:#fca5a5">Не удалось встроить страницу и скачать её текст.</p>
            <p style="color:#9ca3af;font-size:13px">${escapeHtml(e.message || String(e))}</p>
            <p style="color:#9ca3af;font-size:13px">Частая причина: сайт режет iframe и CORS.</p>
            <button class="btn" id="br-open-ext3">Открыть снаружи</button>
          `;
          const b = reader.querySelector("#br-open-ext3");
          if (b) b.onclick = () => window.open(url, "_blank", "noopener,noreferrer");
        }
      };

      const watchIframe = (url) => {
        iframeFailed = false;
        if (loadTimer) clearTimeout(loadTimer);
        if (!url || url.startsWith("data:") || url.startsWith("about:")) {
          setStatus("", false);
          showMode("iframe");
          return;
        }
        // After timeout, if still on error-ish or can't access — try text
        loadTimer = setTimeout(async () => {
          // Try to detect blank/blocked: many mobile browsers show error page inside iframe (opaque)
          // We always offer auto text fallback after short wait if mode still iframe
          if (tabs[active].url !== url || tabs[active].mode === "reader") return;
          try {
            // cross-origin will throw — that's expected for real sites
            const doc = frame.contentDocument;
            if (doc && doc.location && doc.body) {
              const bodyText = (doc.body.innerText || "").slice(0, 200);
              if (/ERR_BLOCKED|отказано|blocked|не удалось открыть|This content is blocked/i.test(bodyText)) {
                await fallbackToText(url);
                return;
              }
            }
          } catch (_) {
            // opaque — assume may be blocked on mobile webviews; soft fallback only if user preference
            // Auto text after first setup preference
            const auto = localStorage.getItem(SETUP_KEY) === "1";
            if (auto) {
              // Don't always steal working pages: only if iframe error event fired
              if (iframeFailed) await fallbackToText(url);
            }
          }
        }, 2200);

        frame.onload = () => {
          try {
            const doc = frame.contentDocument;
            const bodyText = (doc?.body?.innerText || "").slice(0, 300);
            if (/ERR_BLOCKED|net::ERR|не удалось открыть веб|This content is blocked|blocked by response/i.test(bodyText)) {
              iframeFailed = true;
              fallbackToText(url);
            } else {
              setStatus("", false);
              showMode("iframe");
            }
          } catch (_) {
            // cross-origin success often throws — treat as OK
            setStatus("", false);
            showMode("iframe");
          }
        };
        frame.onerror = () => {
          iframeFailed = true;
          fallbackToText(url);
        };
      };

      const renderTabs = () => {
        tabsEl.innerHTML = tabs.map((t, i) => `
          <div class="linux-tab ${i === active ? "active" : ""}" data-i="${i}">
            <span style="flex:1;overflow:hidden;text-overflow:ellipsis">${escapeHtml(t.title)}</span>
            <span class="tab-x" data-close="${i}">✕</span>
          </div>
        `).join("") + `<button class="linux-tab-add" id="br-newtab">+</button>`;

        tabsEl.querySelectorAll(".linux-tab").forEach(el => {
          el.onclick = (e) => {
            if (e.target.dataset.close !== undefined) {
              const ci = +e.target.dataset.close;
              tabs.splice(ci, 1);
              if (!tabs.length) {
                tabs.push({ id: idSeq++, title: "Домашняя", url: homeHtml, mode: "iframe" });
                active = 0;
              } else {
                active = Math.min(active, tabs.length - 1);
              }
              showTab();
              return;
            }
            active = +el.dataset.i;
            showTab();
          };
        });
        const nt = tabsEl.querySelector("#br-newtab");
        if (nt) nt.onclick = () => {
          tabs.push({ id: idSeq++, title: "Новая", url: homeHtml, mode: "iframe" });
          active = tabs.length - 1;
          showTab();
        };
      };

      const showTab = () => {
        const t = tabs[active];
        urlInput.value = t.url.startsWith("data:") ? "" : t.url;
        if (t.mode === "reader" && t.readerCache) {
          showReader(t.url, t.readerCache);
        } else {
          showMode("iframe");
          frame.src = t.url;
          watchIframe(t.url);
        }
        renderTabs();
      };

      const navigate = (raw) => {
        let u = (raw || "").trim();
        if (!u) return;
        if (!/^https?:\/\//i.test(u) && !u.startsWith("data:") && !u.startsWith("about:")) {
          if (u.includes(" ") || !u.includes(".")) {
            u = "https://duckduckgo.com/html/?q=" + encodeURIComponent(u);
          } else {
            u = "https://" + u;
          }
        }
        tabs[active].url = u;
        tabs[active].mode = "iframe";
        tabs[active].readerCache = null;
        try {
          tabs[active].title = new URL(u).hostname || "Вкладка";
        } catch {
          tabs[active].title = "Вкладка";
        }
        Logger.debug("browser navigate");
        showMode("iframe");
        frame.src = u;
        urlInput.value = u.startsWith("data:") ? "" : u;
        renderTabs();
        watchIframe(u);
        // Aggressive auto-fallback for known blockers after short delay
        setTimeout(() => {
          if (tabs[active].url === u && tabs[active].mode === "iframe") {
            // On mobile Android WebView, error pages are same-origin sometimes
            try {
              const bodyText = frame.contentDocument?.body?.innerText || "";
              if (/ERR_BLOCKED|BLOCKED_BY_RESPONSE|не удалось открыть/i.test(bodyText)) {
                fallbackToText(u);
              }
            } catch (_) {}
          }
        }, 1500);
      };

      win.querySelector("#br-go").onclick = () => navigate(urlInput.value);
      urlInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") navigate(urlInput.value);
      });
      win.querySelector("#br-home").onclick = () => navigate(homeHtml);
      win.querySelector("#br-reload").onclick = () => {
        const u = tabs[active].url;
        if (tabs[active].mode === "reader") fallbackToText(u);
        else { frame.src = u; watchIframe(u); }
      };
      win.querySelector("#br-back").onclick = () => {
        try { frame.contentWindow.history.back(); } catch (_) { notify("Назад недоступно", "info"); }
      };
      win.querySelector("#br-burn").onclick = () => {
        tabs[active] = { id: idSeq++, title: "Домашняя", url: homeHtml, mode: "iframe" };
        frame.src = "about:blank";
        setTimeout(showTab, 40);
        setStatus("", false);
        notify("Вкладка сброшена", "success");
      };
      win.querySelector("#br-text").onclick = () => {
        const u = tabs[active].url;
        if (u && !u.startsWith("data:")) fallbackToText(u);
        else notify("Нет URL для текста", "info");
      };
      win.querySelector("#br-ext").onclick = () => {
        const u = tabs[active].url;
        if (u && !u.startsWith("data:")) window.open(u, "_blank", "noopener,noreferrer");
        else notify("Нет внешнего URL", "info");
      };

      // First-run setup
      const runSetup = () => {
        if (localStorage.getItem(SETUP_KEY) === "1") return;
        const overlay = document.createElement("div");
        overlay.className = "modal-overlay";
        overlay.innerHTML = `
          <div class="modal">
            <h3>Настройка браузера</h3>
            <p style="color:var(--text-muted);font-size:14px;margin-bottom:12px;line-height:1.45">
              Многие сайты блокируют iframe (ошибка ERR_BLOCKED_BY_RESPONSE).<br><br>
              Будет так:<br>
              1) пробуем открыть в окне<br>
              2) если блок — скачиваем текст страницы<br>
              3) можно открыть сайт снаружи кнопкой ↗
            </p>
            <div class="modal-actions">
              <button class="btn" id="br-setup-ok" style="flex:1;justify-content:center">Включить умный режим</button>
            </div>
          </div>`;
        document.body.appendChild(overlay);
        overlay.querySelector("#br-setup-ok").onclick = () => {
          localStorage.setItem(SETUP_KEY, "1");
          overlay.remove();
          notify("Умный режим браузера включён", "success");
          // auto-test fallback path with a known blocked page is optional — skip network
        };
      };

      showTab();
      setTimeout(runSetup, 300);
    }

    // ============================================================
    // Чат
    // ============================================================
    // —— Live2D + Clippy-style companion ——
    const Companion = {
      model: null,
      app: null,
      ready: false,
      lastComment: 0,
      phrases: {
        files: ["О, файлы. Не потеряй важное~", "Папочки… аккуратнее с удалением.", "Заглянем внутрь?"],
        browser: ["Браузер! Если iframe заблокируют — будет текст.", "Серфим осторожно.", "Опять в интернет?"],
        paint: ["Рисовалка! Мелки ждут.", "Нарисуй что-нибудь милое.", "Я рядом, если заливка убежит."],
        term: ["Терминал. username — сменить имя.", "Команды: help, ls, cd…", "Чёрный экран — это нормально."],
        chat: ["Это я! Пиши сюда.", "Слушаю.", "Ну, выкладывай."],

        idle: ["Если что — ткни меня.", "Скучно? Открой чат.", "Юки на связи."]
      },
      pick(key) {
        const arr = this.phrases[key] || this.phrases.idle;
        return arr[Math.floor(Math.random() * arr.length)];
      },
      async init() {
        const canvas = document.getElementById("mk-canvas");
        if (!canvas) return;

        // Works without local server: model from CDN. Local path as optional fallback.
        const MODEL_URLS = [
          "https://cdn.jsdelivr.net/gh/Live2D/CubismWebSamples@master/Samples/Resources/Hiyori/Hiyori.model3.json",
          "live2d/hiyori/hiyori_free_t08.model3.json"
        ];

        const showFallback = () => {
          const spr = document.getElementById("mk-sprite");
          if (spr) {
            spr.style.display = "block";
            spr.style.width = "72px";
            spr.style.height = "72px";
            spr.style.margin = "24px auto 0";
            spr.style.borderRadius = "50%";
            spr.style.border = "2px solid rgba(255,255,255,0.35)";
            spr.src = localStorage.getItem("vdesktop_bot_avatar") || "icons/mishka.png";
          }
          if (canvas) canvas.style.display = "none";
        };

        if (typeof PIXI === "undefined" || !PIXI.live2d) {
          console.warn("Live2D runtime not loaded");
          showFallback();
          return;
        }

        try {
          const app = new PIXI.Application({
            view: canvas,
            autoStart: true,
            backgroundAlpha: 0,
            width: 220,
            height: 260,
            antialias: true
          });
          this.app = app;

          let model = null;
          let lastErr = null;
          for (const url of MODEL_URLS) {
            try {
              model = await PIXI.live2d.Live2DModel.from(url, { autoInteract: true });
              console.log("Live2D loaded:", url);
              break;
            } catch (e) {
              lastErr = e;
              console.warn("Live2D try failed:", url, e);
            }
          }
          if (!model) throw lastErr || new Error("no model");

          this.model = model;
          const s = 0.12;
          model.scale.set(s);
          model.x = 110;
          model.y = 20;
          app.stage.addChild(model);
          try { model.motion("Idle"); } catch (_) {}
          setInterval(() => {
            if (!this.model) return;
            try { this.model.motion("Idle"); } catch (_) {}
          }, 14000);
          this.ready = true;

          const root = document.getElementById("mishka-live");
          if (root) root.addEventListener("click", () => {
            this.react("chat", true);
            openAAsk();
          });
        } catch (e) {
          console.warn("Live2D load failed", e);
          showFallback();
          const root = document.getElementById("mishka-live");
          if (root) root.addEventListener("click", () => openAAsk());
        }
      },

      motion(name) {
        if (!this.model) return;
        try { this.model.motion(name); } catch (_) {
          try { this.model.motion("Tap"); } catch (__) {}
        }
      },
      say(text, ms) {
        mishkaSpeak(text, ms);
        this.motion("Tap");
      },
      react(key, force) {
        const now = Date.now();
        if (!force && now - this.lastComment < 4500) return;
        this.lastComment = now;
        this.say(this.pick(key));
      },
      watch() {
        const wrap = (obj, key, tag) => {
          if (!obj || typeof obj[key] !== "function") return;
          const orig = obj[key].bind(obj);
          obj[key] = (...args) => {
            try { this.react(tag); } catch (_) {}
            return orig(...args);
          };
        };
        // delay wrap until functions exist — call after definitions via init end
      }
    };

    function mishkaSpeak(text, ms) {
      const root = document.getElementById("mishka-live");
      const bubble = document.getElementById("mk-bubble");
      if (!root || !bubble) return;
      const short = String(text || "").replace(/\s+/g, " ").trim().slice(0, 110);
      bubble.textContent = short + (String(text || "").length > 110 ? "…" : "");
      bubble.classList.add("show");
      root.classList.add("speaking");
      clearTimeout(window.__mkSpeakTimer);
      window.__mkSpeakTimer = setTimeout(() => {
        root.classList.remove("speaking");
        bubble.classList.remove("show");
      }, ms || Math.min(7000, 1800 + short.length * 35));
    }

    function companionReact(tag) {
      try { Companion.react(tag); } catch (_) {}
    }


    function openAAsk() {

      const userName = localStorage.getItem("vdesktop_username") || Shell.env.USER || "user";

      const content = `

      let cachedToken = "";

      const loadToken = async () => {

      // click live model opens chat
      const live = document.getElementById("mishka-live");
      if (live) live.onclick = () => { /* already in chat */ };
      setTimeout(() => input.focus(), 200);
    }

    // ============================================================
    // SETTINGS
    // ============================================================
    function openSettings() {
      companionReact("settings");
      const content = `
        <div class="settings-section">
          <h3>🖼 Обои</h3>
          <div class="wallpaper-grid">
            ${Object.entries(wallpapers).map(([key, val]) => `
              <div class="wallpaper-option ${state.wallpaper === key ? "active" : ""}"
                   data-key="${key}" style="background:${val}"></div>
            `).join("")}
          </div>
          <div class="color-picker-row">
            <label>Цвет:</label>
            <input type="color" id="custom-color" value="#0f172a" />
            <button class="btn secondary" id="apply-color">OK</button>
          </div>
          <div style="margin-top:12px">
            <button class="btn" id="upload-wallpaper" style="width:100%;justify-content:center">📷 Своё фото</button>
            <input type="file" id="wallpaper-input" accept="image/*" />
          </div>
        </div>

        <div class="settings-section">
          <h3>⚙️ Система</h3>
          <p style="color:var(--text-muted);margin-bottom:10px;font-size:13px">
            ФС: <strong id="fs-size">—</strong> · Логи: <strong id="log-count">—</strong>
          </p>
          <button class="btn secondary" id="export-fs" style="width:100%;margin-bottom:6px;justify-content:center">💾 Экспорт ФС</button>
          <button class="btn danger" id="reset-fs" style="width:100%;justify-content:center">🗑 Сбросить ФС</button>
        </div>

        <div class="settings-section">
          <h3>🔄 Фон</h3>
          <button class="btn" id="start-bg-task" style="width:100%;justify-content:center">Запустить задачу (5 сек)</button>
        </div>
      `;

      const win = createWindow("settings", "Настройки", content);

      win.querySelector("#fs-size").textContent = formatSize(FS.getSize(FS.root));
      win.querySelector("#log-count").textContent = Logger.entries.length;

      win.querySelectorAll(".wallpaper-option").forEach(el => {
        el.onclick = () => {
          state.wallpaper = el.dataset.key;
          localStorage.setItem("vdesktop_wallpaper", state.wallpaper);
          renderDesktop();
          win.querySelectorAll(".wallpaper-option").forEach(x => x.classList.remove("active"));
          el.classList.add("active");
          notify("Обои изменены", "success");
        };
      });

      win.querySelector("#apply-color").onclick = () => {
        const color = win.querySelector("#custom-color").value;
        state.wallpaper = color;
        localStorage.setItem("vdesktop_wallpaper", color);
        renderDesktop();
        notify("Цвет применён", "success");
      };

      win.querySelector("#upload-wallpaper").onclick = () => win.querySelector("#wallpaper-input").click();
      win.querySelector("#wallpaper-input").onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          state.wallpaper = reader.result;
          localStorage.setItem("vdesktop_wallpaper", reader.result);
          renderDesktop();
          notify("Обои загружены", "success");
        };
        reader.readAsDataURL(file);
      };

      win.querySelector("#export-fs").onclick = () => {
        const data = JSON.stringify(FS.root, null, 2);
        const blob = new Blob([data], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "virtual-fs.json";
        a.click();
        URL.revokeObjectURL(url);
        Logger.info("Экспорт ФС выполнен");
        notify("Экспорт выполнен", "success");
      };

      win.querySelector("#reset-fs").onclick = () => {
        if (!confirm("Удалить всю файловую систему?")) return;
        localStorage.removeItem("vdesktop_fs");
        FS.root = { name: "/", type: "folder", children: {} };
        FS.mkdir("/Документы");
        FS.mkdir("/Изображения");
        FS.mkdir("/Загрузки");
        FS.mkdir("/bin");
        FS.save();
        state.currentPath = "/";
        Shell.cwd = "/";
        renderDesktop();
        if (state.openWindows["fm"]) renderFileList();
        Logger.warn("Файловая система сброшена");
        notify("Сброшено", "success");
      };

      win.querySelector("#start-bg-task").onclick = () => runBackgroundTask();
    }

    function runBackgroundTask() {
      state.bgTasks++;
      updateBgStatus();
      Logger.info("Фоновая задача запущена");
      notify("Фоновая задача запущена", "info");

      setTimeout(() => {
        const size = FS.getSize(FS.root);
        state.bgTasks--;
        updateBgStatus();
        Logger.info("Фоновая задача завершена, размер ФС: " + formatSize(size));
        notify(`Готово. ФС: ${formatSize(size)}`, "success");
      }, 5000);
    }

    function updateBgStatus() {
      const el = document.getElementById("bg-status");
      if (state.bgTasks > 0) {
        el.classList.add("active");
        el.innerHTML = `<span class="spinner"></span> Фоновых задач: ${state.bgTasks}`;
      } else {
        el.classList.remove("active");
      }
    }

    // ============================================================
    // UPLOAD
    // ============================================================
    function handleUpload(files) {
      companionReact("upload");
      const path = state.openWindows["fm"] ? state.currentPath : "/Загрузки";
      if (!FS.resolve("/Загрузки")) FS.mkdir("/Загрузки");

      let count = 0;
      const total = files.length;

      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = () => {
          const fullPath = path === "/" ? "/" + file.name : path + "/" + file.name;
          FS.writeFile(fullPath, reader.result, file.type || "application/octet-stream");
          count++;
          if (count === total) {
            Logger.info(`Загружено файлов: ${count}`);
            notify(`Загружено: ${count}`, "success");
            renderFileList();
            renderDesktop();
          }
        };
        reader.onerror = () => {
          count++;
          Logger.error("Ошибка чтения файла: " + file.name);
          notify("Ошибка чтения", "error");
        };
        reader.readAsDataURL(file);
      });
    }

    // ============================================================
    // CONTEXT MENU
    // ============================================================
    function showContextMenu(e, item, parentPath) {
      const menu = document.getElementById("context-menu");
      const overlay = document.getElementById("ctx-overlay");
      const fullPath = parentPath === "/" ? "/" + item.name : parentPath + "/" + item.name;

      menu.innerHTML = `
        <div class="ctx-handle"></div>
        <div class="ctx-item" data-action="open">📂 Открыть</div>
        ${item.type === "file" ? `<div class="ctx-item" data-action="download">⬇️ Скачать</div>` : ""}
        <div class="ctx-separator"></div>
        <div class="ctx-item" data-action="rename">✏️ Переименовать</div>
        <div class="ctx-item" data-action="delete" style="color:#f87171">🗑️ Удалить</div>
      `;

      menu.classList.add("visible");
      overlay.classList.add("visible");

      if (!isMobile()) {
        menu.style.left = Math.min(e.clientX || 0, window.innerWidth - 240) + "px";
        menu.style.top = Math.min(e.clientY || 0, window.innerHeight - 220) + "px";
        menu.style.right = menu.style.bottom = "auto";
      } else {
        menu.style.left = menu.style.top = menu.style.right = menu.style.bottom = "";
      }

      menu.querySelectorAll(".ctx-item").forEach(el => {
        el.onclick = () => {
          const action = el.dataset.action;
          hideContextMenu();
          if (action === "open") {
            if (item.type === "folder") openFileManager(fullPath);
            else openFile(fullPath);
          } else if (action === "download" && item.type === "file") {
            const a = document.createElement("a");
            a.href = item.content;
            a.download = item.name;
            a.click();
          } else if (action === "delete") {
            if (confirm("Удалить «" + item.name + "»?")) {
              FS.delete(fullPath);
              notify("Удалено", "success");
              renderFileList();
              renderDesktop();
            }
          } else if (action === "rename") {
            showPrompt("Переименовать", "Новое имя:", (newName) => {
              if (!newName || newName === item.name) return;
              const parent = FS.resolve(parentPath);
              if (parent.children[newName]) {
                notify("Имя занято", "error");
                return;
              }
              parent.children[newName] = { ...item, name: newName };
              delete parent.children[item.name];
              FS.save();
              notify("Переименовано", "success");
              renderFileList();
              renderDesktop();
            }, item.name);
          }
        };
      });
    }

    function showDesktopContextMenu(e) {
      const menu = document.getElementById("context-menu");
      const overlay = document.getElementById("ctx-overlay");

      menu.innerHTML = `
        <div class="ctx-handle"></div>
        <div class="ctx-item" data-action="refresh">🔄 Обновить</div>
        <div class="ctx-item" data-action="newfolder">📁 Новая папка</div>
        <div class="ctx-item" data-action="upload">⬆️ Загрузить</div>
        <div class="ctx-separator"></div>
        <div class="ctx-item" data-action="term">💻 Терминал</div>
        <div class="ctx-item" data-action="logs">📋 Логи</div>
        <div class="ctx-item" data-action="settings">⚙️ Настройки</div>
      `;

      menu.classList.add("visible");
      overlay.classList.add("visible");

      if (!isMobile()) {
        menu.style.left = Math.min(e.clientX || 0, window.innerWidth - 240) + "px";
        menu.style.top = Math.min(e.clientY || 0, window.innerHeight - 220) + "px";
      } else {
        menu.style.left = menu.style.top = menu.style.right = menu.style.bottom = "";
      }

      menu.querySelectorAll(".ctx-item").forEach(el => {
        el.onclick = () => {
          hideContextMenu();
          const a = el.dataset.action;
          if (a === "refresh") renderDesktop();
          else if (a === "newfolder") {
            showPrompt("Новая папка", "Имя:", (name) => {
              if (name && FS.mkdir("/" + name)) {
                notify("Папка создана", "success");
                renderDesktop();
              }
            });
          }
          else if (a === "upload") document.getElementById("file-input").click();
          else if (a === "term") openTerminal();
          else if (a === "logs") openLogs();
          else if (a === "settings") openSettings();
        };
      });
    }

    function hideContextMenu() {
      document.getElementById("context-menu").classList.remove("visible");
      document.getElementById("ctx-overlay").classList.remove("visible");
    }

    // ============================================================
    // PROMPT
    // ============================================================
    function showPrompt(title, label, callback, defaultValue = "") {
      const overlay = document.createElement("div");
      overlay.className = "modal-overlay";
      overlay.innerHTML = `
        <div class="modal">
          <h3>${title}</h3>
          <p style="margin-bottom:8px;color:var(--text-muted);font-size:13px">${label}</p>
          <input type="text" id="prompt-input" value="${escapeHtml(defaultValue)}" autocomplete="off" />
          <div class="modal-actions">
            <button class="btn secondary" id="prompt-cancel">Отмена</button>
            <button class="btn" id="prompt-ok">OK</button>
          </div>
        </div>
      `;
      document.body.appendChild(overlay);
      const input = overlay.querySelector("#prompt-input");
      setTimeout(() => { input.focus(); input.select(); }, 80);

      const close = () => overlay.remove();
      overlay.querySelector("#prompt-cancel").onclick = close;
      overlay.querySelector("#prompt-ok").onclick = () => {
        callback(input.value.trim());
        close();
      };
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") { callback(input.value.trim()); close(); }
        if (e.key === "Escape") close();
      });
    }

    // ============================================================
    // INIT
    // ============================================================
    function init() {
      Logger.load();
      FS.load();
      renderDesktop();

      document.getElementById("btn-files").onclick = () => openFileManager(state.currentPath || "/");
      document.getElementById("btn-browser").onclick = () => openBrowser();
      document.getElementById("btn-paint").onclick = () => openPaint();
      document.getElementById("btn-term").onclick = () => openTerminal();
      document.getElementById("btn-aask").onclick = () => openAAsk();

      document.getElementById("file-input").onchange = (e) => {
        if (e.target.files.length) {
          handleUpload(e.target.files);
          e.target.value = "";
        }
      };

      document.getElementById("ctx-overlay").onclick = hideContextMenu;

      // Live2D companion
      const mkSpr = document.getElementById("mk-sprite");
      const savedBotAv = localStorage.getItem("vdesktop_bot_avatar");
      if (mkSpr) mkSpr.src = savedBotAv || "icons/mishka.png";
      setTimeout(() => Companion.init(), 400);
      setTimeout(() => Companion.say("Привет! Я Юки. Ткни — открою чат.", 4000), 1200);

      Logger.info("Virtual Desktop запущен");
      notify("# -*- coding: utf-8 -*-\nimport os\nimport torch\nimport torch.nn as nn\nfrom google.colab import drive", "info", 5000);
    }

    init();
  </script>
</body>
